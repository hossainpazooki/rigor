apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: legal-compliance
    app.kubernetes.io/part-of: legal-compliance-platform
    environment: production
  name: legal-compliance
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: legal-compliance-platform
    environment: production
  name: frontend
  namespace: legal-compliance
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: legal-compliance-platform
    environment: production
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: legal-compliance-platform
    environment: production
  name: frontend
  namespace: legal-compliance
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: legal-compliance-platform
      environment: production
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: legal-compliance-platform
        environment: production
    spec:
      containers:
      - image: ${ECR_REGISTRY}/legal-compliance-frontend:${IMAGE_TAG}
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 101
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: legal-compliance-platform
    environment: production
  name: frontend-hpa
  namespace: legal-compliance
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 30
        type: Pods
        value: 2
      stabilizationWindowSeconds: 0
  maxReplicas: 6
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/group.name: legal-compliance
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: alb
  labels:
    environment: production
  name: legal-compliance-ingress
  namespace: legal-compliance
spec:
  rules:
  - host: legal-compliance.example.com
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
